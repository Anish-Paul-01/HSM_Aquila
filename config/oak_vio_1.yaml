# ================================================================
# OAK-D Pro configuration — Aquila (ERC 2026 Droning Sub-Task)
# Nadir-mounted (-90 deg pitch), 100mm forward of COM
# Used with depthai-ros camera.launch.py (rgbd_pcl / rgbd pipeline)
# ================================================================

/oak:
  ros__parameters:

    # ---- Camera identity / mounting ----
    camera:
      i_pipeline_type: RGBD          # RGB + depth pipeline
      i_nn_type: none                # YOLO runs on Jetson via ROS2, not on-device NN
      i_usb_speed: SUPER

    # ---- RGB sensor ----
    rgb:
      i_publish_topic: true
      i_resolution: '1080p'          # explicit — do NOT leave default/unset
      i_fps: 30.0                    # explicit — do NOT leave default/unset
      i_interleaved: false
      i_keep_preview_aspect_ratio: true
      i_enable_preview: false

    # ---- Stereo / depth ----
    stereo:
      i_align_depth: true            # CRITICAL — must be true, false silently
                                      # produces wrong world-position estimates
      i_publish_topic: true
      i_depth_preset: HIGH_ACCURACY
      i_stereo_conf_threshold: 200
      i_lr_check: true
      i_subpixel: true
      i_extended_disp: false
      i_rectify: true
      i_width: 1280
      i_height: 720
      i_fps: 30.0                    # explicit — must match/align with rgb.i_fps

    left:
      i_resolution: '720p'
      i_fps: 30.0

    right:
      i_resolution: '720p'
      i_fps: 30.0

    # ---- Sync / QoS ----
    # Match reliability policy explicitly against MATLAB/Jetson subscribers —
    # QoS mismatches (Best Effort vs Reliable) silently drop all messages.
    sync:
      i_enable_sync: true
      i_threshold_ms: 33             # ~1 frame @ 30fps

    # ---- Calibration override (confirmed intrinsics) ----
    # These should match/verify against the camera's factory calibration.
    # fx=398.89, fy=398.82, cx=310.01, cy=185.02
    camera_info:
      i_use_calibration_from_device: true   # set false only if overriding manually below
      # Manual override (only used if i_use_calibration_from_device: false)
      rgb_fx: 398.89
      rgb_fy: 398.82
      rgb_cx: 310.01
      rgb_cy: 185.02

    # ---- Frame IDs (nadir mount, -90 deg) ----
    # Ensure static TF publishes base_link -> oak-d-base_frame with
    # a -90 deg pitch rotation to reflect nadir orientation.
    i_tf_camera_name: oak
    i_tf_base_frame: oak-d-base_frame
    i_tf_parent_frame: base_link