# px4_bridge.yaml
- ros_topic_name: "/clock"
  gz_topic_name: "/world/drone_cage/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ══════════════════════════════════════════════════════════════
# OAK-D PRO — RGB CAMERA (ArUco Detection)
# ══════════════════════════════════════════════════════════════
- ros_topic_name: "/oak/rgb/image_raw"
  gz_topic_name: "/oak/rgb/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: "/oak/rgb/camera_info"
  gz_topic_name: "/oak/rgb/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: false

